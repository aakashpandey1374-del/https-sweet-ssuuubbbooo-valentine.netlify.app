<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For ssuuubbbooo ❤️</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container" role="main">
    <header class="hero" aria-hidden="false">
      <div class="overlay">
        <h1 id="main-title">For ssuuubbbooo ❤️</h1>
        <p id="subtitle">Happy Valentine's Day</p>
        <div class="controls">
          <button id="download-card">Download / Save as PDF</button>
        </div>
      </div>
    </header>

    <section class="message" aria-labelledby="message-heading">
      <h2 id="message-heading">A little love for you</h2>
      <p id="love-note">You have my heart — today and always.</p>
    </section>

    <footer class="footer">
      <small>Made with ❤️ — Forever</small>
    </footer>

    <!-- Floating hearts canvas -->
    <canvas id="hearts-canvas" aria-hidden="true"></canvas>
  </main>

  <script src="script.js"></script>
</body>
</html>
